name: AEGIS CI

on:
  pull_request:
    paths:
      - "aegis-platform/**"
      - ".github/workflows/aegis-ci.yml"
  push:
    branches: [main]
    paths:
      - "aegis-platform/**"
      - ".github/workflows/aegis-ci.yml"

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            aegis-platform/requirements-dev.txt
            aegis-platform/api_gateway/requirements.txt
            aegis-platform/ai_services/demand_response/requirements.txt
            aegis-platform/ai_services/forecasting/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements-dev.txt \
            -r api_gateway/requirements.txt \
            -r ai_services/demand_response/requirements.txt \
            -r ai_services/forecasting/requirements.txt \
            "gymnasium>=0.29"
      - name: Run pytest
        run: python -m pytest -rs

  frontend:
    name: Frontend Audit And Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aegis-platform/frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build

  compose:
    name: Compose Config
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-platform
    steps:
      - uses: actions/checkout@v4
      - name: Create compose env file
        run: cp .env.example .env
      - name: Validate Docker Compose
        run: docker compose config --quiet
